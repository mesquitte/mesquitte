[workspace]
resolver = "3"
members = ["mesquitte-core", "mqtt-codec-kit"]
exclude = ["examples"]

[workspace.package]
license = "Apache-2.0"
readme = "README.md"
authors = [
    "sunj <diablur@gmail.com>",
    "qinxin0720 <qinxin_0720@live.com>",
    "fikers <fikersfan@gmail.com>",
]
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
mqtt-codec-kit = { version = "1.0", path = "mqtt-codec-kit", features = [
    "v4",
    "v5",
    "tokio-codec",
] }

byteorder = "1.5"
bytes = "1.11"
dashmap = "6.1"
env_logger = "0.11"
foldhash = "0.2"
futures = "0.3"
futures-sink = "0.3"
futures-util = "0.3"
kanal = "0.1"
maplit = "1.0"
nanoid = "0.5"
log = "0.4"
parking_lot = "0.12"
pin-project-lite = "0.2"
rand = "0.10"
rustls = { version = "0.23", default-features = false }
rustls-pemfile = "2.2"
s2n-quic = "1"
tempfile = "3.23"
thiserror = "2.0"
tokio = "1.48"
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = "0.30"
tokio-util = "0.7"
tungstenite = "0.29"

[profile.release]
lto = true
codegen-units = 1
incremental = false

[profile.bench]
lto = true
codegen-units = 1
incremental = false
debug = true
